<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>范例页面</title>
	<link rel="stylesheet" type="text/css" href="/layui/css/layui.css">
	<style>
		.layui-table-cell {
			text-align: center;
			height: 32px;
			line-height: 32px;
			padding: 0;
		}
		.layui-unselect {
			height: 32px;
		}
		.layui-form-switch {
			height: 24px;
			min-width: 38px;
		}
	</style>
</head>
<body>
	<!-- 标题 -->
	<h1 style="text-align: center">数据库内容</h1>
	
	<!-- 表格 -->
	<table class="layui-hide" id="DeviceList" lay-filter="DeviceList">
	</table>
	
	<!-- 表格工具栏 -->
	<script type="text/html" id="DeviceToolbar">
		<div class="layui-btn-container">
			<button class="layui-btn layui-btn-sm layui-bg-blue" lay-event="AddRow">添加数据</button>
			<button class="layui-btn layui-btn-sm layui-bg-blue" lay-event="DelRow">删除数据</button>
			<button class="layui-btn layui-btn-sm layui-bg-blue" lay-event="RefreshList">刷新列表</button>
		</div>
	</script>
	
	<!-- body 末尾处引入 layui -->
	<script src="/layui/layui.js"></script>
	
	<!-- 功能逻辑实现 -->
	<script>
		layui.use(['table', 'dropdown'], function(){
			var form = layui.form;
			var table = layui.table;
			var dropdown = layui.dropdown;
			var layer = layui.layer;
			var util = layui.util;
			
			// 创建渲染实例
			table.render({
				elem: '#DeviceList',
				url: '/app/list',
				toolbar: '#DeviceToolbar',
				defaultToolbar: ['filter', 'exports', 'print', { // 右上角工具图标
					title: '提示',
					layEvent: 'LAYTABLE_TIPS',
					icon: 'layui-icon-tips',
					onClick: function(obj) { // 2.9.12+
						layer.alert('自定义工具栏图标按钮');
					}
				}],
				height: 'full-56', // 最大高度减去其他容器已占有的高度差
				cellMinWidth: 60,
				totalRow: false,
				page: true,
				cols: [[
					{field:'id', fixed: 'left', width:60, title: 'ID', sort: true, unresize: true},
					{field:'name', width:120, title: '姓名', sort: true, templet: '#DeviceListField_Type'},
					{field:'age', width:80, title: '年龄', sort: true, edit: 'text'},
					{field:'mail', width:240, title: '邮箱', sort: true, edit: 'text'},
					{field:'desc', minWidth:160, title: '备注', sort: true, edit: 'text'}
				]],
				done: function(){
					var id = this.id;
				},
				error: function(res, msg){
					console.log(res, msg)
				}
			});

			// 工具栏事件
			table.on('toolbar(DeviceList)', function(obj){
				var id = obj.config.id;
				var checkStatus = table.checkStatus(id);
				var othis = lay(this);
				switch(obj.event){
					case 'AddRow':
						// 添加数据
						layer.open({
							title: '添加数据',
							type: 2,
							shadeClose: true,
							maxmin: true,
							area: ['640px', '495px'],
							content: '/add.html',
							end: function(){
								table.reloadData('DeviceList', {
									scrollPos: 'fixed'  // 保持滚动条位置不变 - v2.7.3 新增
								});
							}
						});
					break;
					case 'DelRow':
						// 删除数据
						// 发送请求
						fetch("/app/del", {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json'
							},
							body: "[1, 4]"
						})
						.then(response => response.json())
						.then(data => {
							if ( data.result ) {
								layer.msg(data.message, {icon: 1});
							} else {
								layer.msg('请求服务报错：' + data.message, {icon: 2}, function(){});
							}
						})
						.catch(error => {
							layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2}, function(){});
							console.error('Error:', error)
						});
						/*
						var data = checkStatus.data;
						if ( data.length == 0 ) {
							layer.msg("请先选择要删除的设备！", {icon: 2});
						} else {
							arrID = new Array();
							for ( var i = 0; i < data.length; i++ ) {
								arrID.push(data[i]["id"])
							}
							// 发送请求
							fetch("/device/delete", {
								method: 'POST',
								headers: {
									'Content-Type': 'application/json'
								},
								body: JSON.stringify(arrID)
							})
							.then(response => response.json())
							.then(data => {
								if ( data.result ) {
									table.reloadData('DeviceList', {
										scrollPos: 'fixed'  // 保持滚动条位置不变 - v2.7.3 新增
									});
									layer.msg(data.message, {icon: 1});
								} else {
									layer.msg('请求服务报错：' + data.message, {icon: 2}, function(){});
								}
							})
							.catch(error => {
								layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2}, function(){});
								console.error('Error:', error)
							});
						}
						*/
					break;
					case 'RefreshList':
						// 刷新列表
						table.reloadData('DeviceList', {
							scrollPos: 'fixed'  // 保持滚动条位置不变 - v2.7.3 新增
						});
					break;
				};
			});
			
			// 单元格工具事件
			table.on('tool(DeviceList)', function(obj){
				var data = obj.data; // 获得当前行数据
				if(obj.event === 'CheckLink'){
					layer.alert("暂未实现的功能");
				}
			});
			
			// table 滚动时移除内部弹出的元素
			var tableInst = table.getOptions('DeviceList');
			tableInst.elem.next().find('.layui-table-main').on('scroll', function() {
				dropdown.close('dropdown-table-tool');
			});

			// 行单击事件
			table.on('row(DeviceList)', function(obj){
				//console.log(obj);
				//layer.closeAll('tips');
			});
			
			// 行双击事件
			table.on('rowDouble(DeviceList)', function(obj){
				//console.log(obj);
			});
			
			// 单元格编辑事件 - 输入框
			table.on('edit(DeviceList)', function(obj){
				var field = obj.field;			// 得到字段
				var value = obj.value;			// 得到修改后的值
				var oldValue = obj.oldValue		// 得到修改前的值
				var data = obj.data;			// 得到所在行所有键值
				var tblData = { id: data.id, field: field, value: value };
				// 发送请求
				fetch("/device/update", {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(tblData)
				})
				.then(response => response.json())
				.then(data => {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
					} else {
						var update = {};
						update[field] = oldValue;
						obj.update(update, true);
						layer.msg('请求服务报错：' + data.message, {icon: 2}, function(){});
					}
				})
				.catch(error => {
					var update = {};
					update[field] = oldValue;
					obj.update(update, true);
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2}, function(){});
					console.error('Error:', error)
				});
			});
			
		});
	</script>
</body>
</html>
