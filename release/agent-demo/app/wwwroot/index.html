<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NativeHarness — agent 前端</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M58 6H46L6 50V58H18L58 14V6Z' fill='%236cb0ec' fill-opacity='.76'/%3E%3Cpath d='M6 6H18L58 50V58H46L6 14V6Z' fill='%236cb0ec'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/tokens.css?v=19" />
  <link rel="stylesheet" href="css/app.css?v=20" />
</head>
<body>
  <div id="app" class="frame">
    <aside class="sidebar-col" id="sidebar-col"></aside>
    <div class="center-col">
      <section class="cv-root" id="cv-root" data-phase="hero">
        <header class="cv-header" id="topbar"></header>
        <div class="cv-scroll" id="chat-scroll">
          <div id="chat-list"></div>
          <div class="cv-composer-seat" id="composer-seat" data-composer-seat>
            <div id="docks"></div>
            <footer id="composer-wrap"></footer>
          </div>
        </div>
      </section>
      <section class="settings-root" id="settings-root" hidden></section>
    </div>
    <aside class="details-col" id="details-col"></aside>
  </div>
  <script>
    window.__bootErrs = [];
    window.addEventListener('error', function (e) {
      window.__bootErrs.push((e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0));
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErrs.push('rej: ' + (e.reason && e.reason.stack ? e.reason.stack.split('\n').slice(0, 3).join(' | ') : String(e.reason)));
    });
  </script>
  <script type="module" src="src/main.js?v=18"></script>
</body>
</html>
