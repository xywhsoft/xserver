<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>TCP 点对点示例</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<div class="page">
		<section class="hero">
			<div>
				<p class="eyebrow">xserver examples / tcp</p>
				<h1>TCP 点对点通信看板</h1>
				<p class="desc">浏览器只做展示，真实 TCP 数据由命令行客户端发送。页面会轮询在线连接和最近消息。</p>
			</div>
			<div class="hero-side">
				<div class="meta">HTTP：`18380`</div>
				<div class="meta">TCP：`18392`</div>
			</div>
		</section>

		<section class="panel">
			<h2>客户端命令示例</h2>
			<pre class="code">python tools/tcp_peer.py --host 127.0.0.1 --port 18392 --name client-a</pre>
		</section>

		<section class="grid">
			<div class="panel">
				<div class="panel-head">
					<h2>在线连接</h2>
					<button class="btn" id="RefreshPeerBtn" type="button">刷新</button>
				</div>
				<div id="PeerList"></div>
			</div>

			<div class="panel">
				<div class="panel-head">
					<h2>最近消息</h2>
					<button class="btn" id="RefreshLogBtn" type="button">刷新</button>
				</div>
				<div id="LogList"></div>
			</div>
		</section>
	</div>

	<script src="/js/app.js"></script>
</body>
</html>
