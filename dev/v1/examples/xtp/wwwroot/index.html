<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>XTP 日志推送示例</title>
	<link rel="stylesheet" href="/css/app.css">
</head>
<body>
	<div class="page">
		<section class="hero">
			<div>
				<p class="eyebrow">xserver examples / xtp</p>
				<h1>XTP 日志推送面板</h1>
				<p class="desc">这个页面只负责展示日志列表。使用目录内的 `tools/push_log.py` 即可往 `127.0.0.1:18294` 推送日志消息。</p>
			</div>
			<div class="hero-side">
				<div class="meta">HTTP：`18280`</div>
				<div class="meta">XTP：`18294`</div>
			</div>
		</section>

		<section class="panel">
			<h2>推送命令示例</h2>
			<pre class="code">python tools/push_log.py --host 127.0.0.1 --port 18294 --level INFO --source cli --message "hello xtp"</pre>
		</section>

		<section class="panel">
			<div class="panel-head">
				<h2>日志列表</h2>
				<button class="btn" id="RefreshBtn" type="button">立即刷新</button>
			</div>
			<div class="table-wrap">
				<table class="table">
					<thead>
						<tr>
							<th>ID</th>
							<th>时间</th>
							<th>级别</th>
							<th>来源</th>
							<th>命令</th>
							<th>消息类型</th>
							<th>内容</th>
						</tr>
					</thead>
					<tbody id="LogBody"></tbody>
				</table>
			</div>
		</section>
	</div>

	<script src="/js/app.js"></script>
</body>
</html>
