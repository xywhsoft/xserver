<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>添加数据</title>
	<link rel="stylesheet" type="text/css" href="/res/layui/css/layui.css">
	<style>
		body {
			margin: 20px;
			background: #f6f8fb;
		}
		.form-card {
			max-width: 560px;
			padding: 20px 12px 8px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 12px 32px rgba(31, 56, 88, 0.08);
		}
	</style>
</head>
<body>
	<div class="form-card">
		<form class="layui-form" action="">
			<div class="layui-form-item">
				<label class="layui-form-label">姓名</label>
				<div class="layui-input-block">
					<input type="text" name="name" lay-verify="required" placeholder="请输入" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">年龄</label>
				<div class="layui-input-block">
					<input type="text" name="age" placeholder="请输入" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">邮箱</label>
				<div class="layui-input-block">
					<input type="text" name="mail" placeholder="请输入" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">备注</label>
				<div class="layui-input-block">
					<input type="text" name="desc" placeholder="请输入" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-input-block">
					<button type="submit" class="layui-btn layui-bg-blue" lay-submit lay-filter="AddRow">立即提交</button>
				</div>
			</div>
		</form>
	</div>
	
	<!-- body 末尾处引入 layui -->
	<script src="/res/layui/layui.js"></script>
	<script>
		layui.use(['form'], function(){
			var form = layui.form;
			var layer = layui.layer;
			var laydate = layui.laydate;
			var util = layui.util;
			var procMessage = function(tblData)
			{
				if ( !tblData ) {
					return '';
				}
				return tblData.msg || tblData.message || '';
			};
			
			// 提交事件
			form.on('submit(AddRow)', function(data){
				// 获取表单字段值
				var field = data.field;
				var index = parent.layer.getFrameIndex(window.name);
				
				// 发送请求
				fetch("/app/add", {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(field)
				})
				.then(response => response.json())
				.then(data => {
					if ( data.result ) {
						parent.layer.close(index);
						parent.layer.msg(procMessage(data), {icon: 1});
					} else {
						parent.layer.msg('请求服务报错：' + procMessage(data), {icon: 2}, function(){});
					}
				})
				.catch(error => {
					parent.layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2}, function(){});
					console.error('Error:', error)
				});
				
				// 阻止默认 form 跳转
				return false;
			});
		});
	</script>
</body>
</html>
